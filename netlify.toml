[build]
  command = "npm run build"
  publish = "dist"

# Old asset files must return a real 404 (not the app page), so the app can
# detect an update and reload itself instead of showing a blank screen
[[redirects]]
  from = "/static/*"
  to = "/static/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Always fetch the latest app shell; hashed asset files can be cached for a year
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
